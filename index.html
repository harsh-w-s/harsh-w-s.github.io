<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Harshwardhan Solanki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Harshwardhan Solanki, Java backend developer: Spring Boot, REST APIs, Spring Security and MySQL.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: Pamidor-style editorial portfolio. Giant expanded wordmark with a red script note,
   a stack marquee, numbered skillset that follows a request through the stack,
   project cards with ROLE / TIMELINE / STACK meta, a live Staffy API console, and a contact composer. */
:root{
  --bg:#E9EAEC;        /* cool paper grey */
  --surface:#F7F7F8;
  --ink:#111214;
  --muted:#5D626A;
  --line:#CDD0D5;
  --red:#DE2F1D;       /* signal red, used like a marker */
  --ok:#1E7B4F;
  --warn:#B4650E;
  --f-display:"Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-script:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --step--1:.8125rem; --step-0:1rem; --step-1:1.1875rem; --step-2:1.5rem; --step-3:clamp(1.6rem,1.1rem + 2.2vw,2.5rem);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#17191C; --ink:#ECEDEF; --muted:#9298A1; --line:#2A2D33;
  --red:#FF5A45; --ok:#4CC38A; --warn:#E8A04A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#17191C; --ink:#ECEDEF; --muted:#9298A1; --line:#2A2D33;
  --red:#FF5A45; --ok:#4CC38A; --warn:#E8A04A; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--step-0);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--red)}
a:hover{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.page{max-width:1200px;margin:0 auto}
.mono{font-family:var(--f-mono)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:16px;z-index:20;background:var(--ink);color:var(--bg);padding:6px 10px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wordmark{font-family:var(--f-display);font-stretch:125%;font-weight:850;text-transform:uppercase;letter-spacing:-.01em;text-decoration:none;font-size:var(--step-1)}
.wordmark span{color:var(--red)}
.nav{display:flex;gap:4px 20px;flex-wrap:wrap}
.nav a{font-family:var(--f-mono);font-size:var(--step--1);text-decoration:none;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.nav a:hover,.nav a.on{color:var(--ink)}
.nav a.on::before{content:"● ";color:var(--red);font-size:.7em;vertical-align:.15em}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:var(--step--1);text-decoration:none;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:999px;padding:8px 16px;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.pill:hover{background:var(--red);border-color:var(--red);color:#fff}
.pill.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.pill.ghost:hover{border-color:var(--red);color:var(--red);background:transparent}

/* hero */
.hero{position:relative;padding-block:clamp(28px,6vw,72px) 32px;overflow:hidden}
.mega{font-family:var(--f-display);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(4.4rem,20.5vw,16.5rem);line-height:.8;letter-spacing:-.035em;margin:0;position:relative}
.mega .sub{display:block;font-size:.205em;letter-spacing:.02em;line-height:1;margin-top:.32em;font-weight:700;text-align:right}
.mega .sub i{font-style:normal;color:var(--red)}
.script{position:absolute;right:2%;top:-.05em;font-family:var(--f-script);font-weight:700;color:var(--red);font-size:clamp(1.8rem,4.6vw,3.6rem);text-transform:none;letter-spacing:0;transform:rotate(-7deg);line-height:1;pointer-events:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px 48px;margin-top:clamp(28px,5vw,56px);align-items:end}
.statement{font-family:var(--f-display);font-stretch:100%;font-weight:500;font-size:var(--step-3);line-height:1.15;letter-spacing:-.015em;max-width:26ch}
.statement b{font-weight:800;font-stretch:112%}
.hero-side{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.status{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cv-note{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-height:1.3em}
.trail{position:absolute;pointer-events:none;font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-50%);animation:trail .9s ease-out forwards;z-index:2}
.trail.a{background:var(--ink);color:var(--bg)}
.trail.b{background:var(--red);color:#fff}
.trail.c{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
@keyframes trail{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-120%) scale(.96)}}
.hint{font-size:var(--step--1);color:var(--muted)}

/* hero layout with the hanging badge */
.hero{overflow:visible;z-index:3}
body{overflow-x:clip}
.hero-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"mega rig" "grid rig";column-gap:clamp(24px,4vw,56px);align-items:start}
.hero-wrap .mega{grid-area:mega;font-size:clamp(3.6rem,14.2vw,12.6rem)}
.hero-wrap .hero-grid{grid-area:grid}

/* badge rig */
.rig{--bw:clamp(180px,19vw,236px);--L:118px;grid-area:rig;grid-row:1 / span 2;position:relative;width:var(--bw);height:calc(var(--L) + var(--bw) * 1.62 + 26px);margin-top:calc(-1 * clamp(28px,6vw,72px))}
.rig svg.lan{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lan .strap{fill:none;stroke:var(--red);stroke-width:13;stroke-linecap:butt}
.lan .edge{fill:none;stroke:rgba(0,0,0,.18);stroke-width:13;stroke-dasharray:1 3}
.lan text{font-family:var(--f-mono);font-size:7.5px;letter-spacing:.12em;fill:#fff;dominant-baseline:central}
.lan .hook{fill:var(--ink)}
.rig-hint{position:absolute;right:calc(100% + 10px);top:calc(var(--L) + var(--bw) * .55);font-family:var(--f-script);font-weight:700;color:var(--red);font-size:1.35rem;line-height:1.05;transform:rotate(-7deg);white-space:nowrap;pointer-events:none;text-align:right;transition:opacity .3s}
.rig-hint::after{content:"↘";display:block;font-size:1.4rem}

.badge{--card:#FBFAF7;--card-ink:#111214;--card-muted:#6B7078;--card-line:#E1E2E5;--card-back:#141619;
  position:absolute;left:0;top:0;width:var(--bw);transform-origin:50% 0;touch-action:none;cursor:grab;container-type:inline-size;outline:none;will-change:transform;user-select:none;-webkit-user-select:none;transform:translate(0px,var(--L))}
.badge.grab{cursor:grabbing}
.badge:focus-visible .face{outline:2px solid var(--red);outline-offset:3px}
.spin{perspective:900px;transform-style:preserve-3d}
.spin.go{animation:spin .75s cubic-bezier(.3,.7,.3,1)}
@keyframes spin{to{transform:rotateY(360deg)}}
.flip{position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.35,.45,1)}
.badge.flipped .flip{transform:rotateY(180deg)}
.clip{position:relative;z-index:2;display:block;margin:0 auto -3cqw;width:20cqw;height:9cqw;border-radius:2.4cqw;background:linear-gradient(180deg,#E3E6EA,#9AA1A9 55%,#C6CBD1);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.face{position:relative;border-radius:5.5cqw;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 22px 34px -16px rgba(0,0,0,.45),0 2px 0 rgba(0,0,0,.04)}
.front{background:var(--card);color:var(--card-ink);padding:6cqw 6cqw 5cqw;display:flex;flex-direction:column;gap:3.4cqw}
.back{position:absolute;inset:0;transform:rotateY(180deg);background:var(--card-back);color:#E8E9EB;display:flex;flex-direction:column}
.slot{width:16cqw;height:3cqw;border-radius:3cqw;background:rgba(0,0,0,.14);margin:0 auto -1cqw}
.b-top{display:flex;justify-content:space-between;align-items:baseline}
.b-logo{font-family:var(--f-display);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:7.4cqw;letter-spacing:-.02em;color:var(--red);line-height:1}
.b-kind{font-family:var(--f-mono);font-size:3.4cqw;letter-spacing:.14em;color:var(--card-muted)}
.b-photo{position:relative;border-radius:3.2cqw;overflow:hidden;aspect-ratio:1;background:#ddd}
.b-photo img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.b-tag{position:absolute;left:3cqw;bottom:3cqw;background:var(--red);color:#fff;font-family:var(--f-mono);font-size:3.2cqw;letter-spacing:.06em;padding:.8cqw 2.2cqw;border-radius:1.4cqw}
.b-stamp{position:absolute;right:2cqw;top:4cqw;border:.8cqw solid var(--red);color:var(--red);font-family:var(--f-display);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:4.6cqw;line-height:1;padding:1.4cqw 2.2cqw;border-radius:2cqw;transform:rotate(12deg) scale(1.8);opacity:0;background:rgba(251,250,247,.82);transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.badge.verified .b-stamp{opacity:1;transform:rotate(12deg) scale(1)}
.b-name{font-family:var(--f-display);font-stretch:112%;font-weight:850;text-transform:uppercase;font-size:8.6cqw;line-height:.95;letter-spacing:-.02em}
.b-meta{display:grid;grid-template-columns:auto 1fr;gap:.6cqw 3cqw;font-family:var(--f-mono);font-size:3.3cqw;line-height:1.35}
.b-meta dt{color:var(--card-muted)}
.b-meta dd{margin:0}
.b-bar{display:block;width:100%;height:7cqw;margin-top:.6cqw}
.b-bar rect{fill:var(--card-ink)}
.mag{height:13cqw;background:#000;margin-top:9cqw}
.b-back-body{padding:5cqw 6cqw 6cqw;display:flex;flex-direction:column;gap:3cqw;flex:1}
.b-claims{margin:0;font-family:var(--f-mono);font-size:3.25cqw;line-height:1.5;white-space:pre;color:#C9CDD3}
.b-claims .k{color:#FF8A78}.b-claims .s{color:#8FD3A8}
.b-found{font-family:var(--f-script);font-weight:700;color:#FF6A55;font-size:8.4cqw;line-height:1;transform:rotate(-4deg);margin-top:auto}
.b-mail{font-family:var(--f-mono);font-size:3.3cqw;color:#E8E9EB;user-select:text;-webkit-user-select:text;word-break:break-all}
.b-sig{font-family:var(--f-mono);font-size:2.9cqw;color:#7D848E;border-top:1px solid #2B2F35;padding-top:2cqw}

@media (max-width:760px){
  .hero-wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"mega" "rig" "grid"}
  .hero-wrap .mega{font-size:clamp(3.4rem,19.5vw,9rem)}
  .rig{--bw:168px;--L:58px;grid-row:auto;justify-self:center;margin-top:10px}
  .rig-hint{font-size:1rem;max-width:24vw;white-space:normal;top:calc(var(--L) + 30px)}
}

/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:14px;-webkit-mask:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.mtrack{display:flex;width:max-content;animation:mq 40s linear infinite}
.mtrack.rev{animation-direction:reverse;animation-duration:52s;margin-top:6px}
.marquee:hover .mtrack{animation-play-state:paused}
.mtrack>div{display:flex}
.mtrack span{font-family:var(--f-display);font-stretch:118%;font-weight:700;text-transform:uppercase;font-size:clamp(1.1rem,.9rem + 1vw,1.6rem);padding-right:.9em;white-space:nowrap;letter-spacing:-.01em}
.mtrack.rev span{color:var(--muted);font-weight:500}
.mtrack span::after{content:"✳";color:var(--red);padding-left:.9em;font-size:.8em;vertical-align:.1em}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.mtrack{width:auto}.mtrack>div{flex-wrap:wrap}.mtrack>[aria-hidden]{display:none}}

/* sections */
main{display:flex;flex-direction:column}
.sec{padding-block:clamp(64px,9vw,120px);scroll-margin-top:60px;display:flex;flex-direction:column;gap:clamp(28px,4vw,48px)}
.sec + .sec{border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.kicker{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:10px;align-items:center}
.kicker::before{content:"";width:22px;height:2px;background:var(--red)}
.title{font-family:var(--f-display);font-stretch:125%;font-weight:850;text-transform:uppercase;font-size:clamp(2.2rem,1.2rem + 5vw,5rem);letter-spacing:-.03em;line-height:.88;margin-top:10px}
.title .s{font-family:var(--f-script);text-transform:none;font-weight:700;color:var(--red);font-stretch:100%;letter-spacing:0;font-size:.62em;margin-left:.15em;vertical-align:.1em}
.lede{color:var(--muted);max-width:52ch}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.about-text{display:flex;flex-direction:column;gap:18px;min-width:0}
.about-text p.big{font-family:var(--f-display);font-weight:500;font-size:var(--step-2);line-height:1.3;letter-spacing:-.01em}
.about-text p.big em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--red) 28%,transparent) 62%)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.fact{border-top:2px solid var(--ink);padding-top:10px}
.fact .num{font-family:var(--f-display);font-stretch:125%;font-weight:850;font-size:clamp(1.8rem,1.2rem + 2vw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.fact .lbl{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}
.float{animation:float 6s ease-in-out infinite;min-width:0}
@keyframes float{50%{transform:translateY(-10px) rotate(.4deg)}}
.code{background:var(--ink);color:#D6D9DE;border-radius:10px;padding:16px 18px 18px;font-family:var(--f-mono);font-size:12.5px;line-height:1.65;overflow-x:auto;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);transform:rotate(-1.5deg)}
.code .bar{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.code .bar i{width:9px;height:9px;border-radius:50%;background:#3A3E45}
.code .bar span{margin-left:auto;font-size:11px;color:#8A9099}
.code pre{margin:0;white-space:pre}
.k{color:#FF7A6A}.an{color:#E8B86B}.st{color:#8FD3A8}.cm{color:#7B828C}.ty{color:#9CC4FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .code{background:#08090A;border:1px solid var(--line)}}
:root[data-theme="dark"] .code{background:#08090A;border:1px solid var(--line)}

.term{transform:rotate(-1.2deg);cursor:text;display:flex;flex-direction:column}
.t-out{max-height:260px;min-height:200px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.t-out>div{min-height:1.65em}
.t-ps{color:#FF7A6A;margin-right:6px}
.t-line{display:flex;align-items:center;margin-top:6px;border-top:1px solid #2A2E35;padding-top:8px}
.t-line input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#F1F2F4;font:inherit;caret-color:#FF7A6A}
.t-line input::placeholder{color:#6B727C}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding-left:6px}
.t-chip{font-family:var(--f-mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;transition:border-color .2s,color .2s}
.t-chip:hover{border-color:var(--red);color:var(--red)}
.t-chip[data-cmd^="sudo"]{border-style:dashed}
.float:focus-within,.float:hover{animation-play-state:paused}

/* skillset: one list, a request dot that travels it */
.stack{position:relative;border-top:2px solid var(--ink);padding-left:34px}
.rail{position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
.rail-dot{position:absolute;left:5px;top:0;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 20%,transparent);transition:transform .45s cubic-bezier(.3,1.3,.5,1);will-change:transform}
.layer{display:grid;grid-template-columns:3.2rem minmax(0,15rem) minmax(0,1fr);gap:6px 20px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);cursor:pointer;outline:none;transition:padding .3s}
.layer .n{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted);transition:color .25s}
.layer h3{font-family:var(--f-display);font-stretch:125%;font-weight:850;text-transform:uppercase;font-size:clamp(1.4rem,1rem + 1.6vw,2.2rem);letter-spacing:-.025em;line-height:1;color:var(--muted);transition:color .25s}
.layer .tools{display:flex;flex-wrap:wrap;gap:6px}
.layer .tools span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink);background:var(--surface);transition:border-color .25s,background .25s,color .25s}
.layer .tools span.new{border-style:dashed;border-color:var(--red)}
.layer .what{grid-column:2 / -1;font-size:var(--step--1);color:var(--muted);max-height:0;overflow:hidden;opacity:0;transition:max-height .35s,opacity .3s}
.layer.on h3,.layer:hover h3,.layer:focus-visible h3{color:var(--ink)}
.layer.on .n{color:var(--red)}
.layer.on .what{max-height:9em;opacity:1}
.layer.lit .tools span{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tag-new{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--red);margin-left:8px;vertical-align:.4em;text-transform:uppercase}
.stack-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.stack-out{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted);min-height:1.5em}
.stack-out b{color:var(--ok);font-weight:500}
@media (max-width:620px){.layer{grid-template-columns:2.4rem minmax(0,1fr)}.layer .tools{grid-column:2}.layer .what{grid-column:2}}
/* projects */
.cards{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px 40px;transition:border-color .25s,transform .25s}
.card:hover{border-color:var(--ink)}
.card .yr{font-family:var(--f-mono);font-size:var(--step--1);color:var(--red)}
.card h3{font-family:var(--f-display);font-stretch:125%;font-weight:850;text-transform:uppercase;font-size:clamp(1.8rem,1rem + 3.2vw,3.4rem);letter-spacing:-.03em;line-height:.9;margin:6px 0 12px}
.card .desc{color:var(--muted);max-width:56ch}
.card ul.pts{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-width:60ch}
.card ul.pts li{padding-left:18px;position:relative;font-size:var(--step--1)}
.card ul.pts li::before{content:"→";position:absolute;left:0;color:var(--red)}
.meta{display:flex;flex-direction:column;gap:14px;margin:0;border-left:1px solid var(--line);padding-left:20px}
.meta dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:2px 0 0;font-size:var(--step--1)}
.jump{font-family:var(--f-mono);font-size:var(--step--1);color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px;margin-top:16px;display:inline-block}
.jump:hover{color:var(--red)}
.card.small{grid-template-columns:minmax(0,1fr) 230px}
.card.small h3{font-size:clamp(1.4rem,1rem + 1.6vw,2rem)}

/* console: break into staffy */
.lab{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.p-head b{color:var(--ink);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.p-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.missions{position:sticky;top:calc(76px + env(safe-area-inset-top,0px))}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mlist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 6px;border-radius:8px;transition:background .3s}
.mlist li .box{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:12px;color:transparent;margin-top:2px;transition:background .25s,border-color .25s,color .25s}
.mlist li.done .box{background:var(--red);border-color:var(--red);color:#fff}
.mlist li.done .mt{text-decoration:line-through;text-decoration-color:var(--red);color:var(--muted)}
.mlist li.flash{background:color-mix(in srgb,var(--red) 14%,transparent)}
.mt{font-size:var(--step--1);font-weight:500;line-height:1.35}
.mh{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.mprog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.mprog i{display:block;height:100%;width:0;background:var(--red);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stamp{display:none;border:2px solid var(--red);color:var(--red);border-radius:10px;padding:12px;text-align:center;transform:rotate(-3deg);font-family:var(--f-display);font-stretch:125%;font-weight:850;text-transform:uppercase;line-height:1.05;font-size:1.05rem}
.stamp small{display:block;font-family:var(--f-script);text-transform:none;font-stretch:100%;font-weight:700;font-size:1.25rem;margin-top:4px}
.stamp.on{display:block;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-3deg) scale(1.6);opacity:0}}
.mreset{font-family:var(--f-mono);font-size:11px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline;align-self:flex-start}

.bench{display:flex;flex-direction:column;gap:16px;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quick .ql{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:4px}
.qb{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.qb:hover{border-color:var(--ink)}
.qb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
.req select,.req input,.req textarea,.jwt textarea{font-family:var(--f-mono);font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.req select{font-weight:500}
.req input:focus,.req select:focus,.req textarea:focus,.jwt textarea:focus{outline:none;border-color:var(--ink)}
.req textarea{grid-column:1 / -1;min-height:74px;resize:vertical}
.send{font-family:var(--f-mono);font-size:13px;background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 18px;cursor:pointer}
.send:disabled{opacity:.6;cursor:progress}
.hdr{grid-column:1 / -1;font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.hdr b{color:var(--ink);font-weight:500}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{font-family:var(--f-mono);font-size:11px;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer}
.preset:hover{color:var(--ink);border-color:var(--ink)}
.pipe{display:flex;align-items:center;overflow-x:auto;padding:2px 0}
.node{flex:0 0 auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--bg);color:var(--muted);transition:background .15s,color .15s,border-color .15s;text-align:center;line-height:1.3}
.node small{display:block;font-size:10px;opacity:.8}
.node.pass{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.node.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.node.stop{background:var(--red);color:#fff;border-color:var(--red)}
.wire{flex:1 0 14px;height:2px;background:var(--line);min-width:14px}
.wire.pass{background:var(--ink)}
.resp-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.code-pill{font-family:var(--f-mono);font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;color:#fff;background:var(--muted)}
.code-pill.s2{background:var(--ok)}.code-pill.s4{background:var(--red)}.code-pill.s3{background:var(--warn)}
.json{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;max-height:260px;min-height:110px;white-space:pre}
.json .jk{color:var(--ink);font-weight:500}.json .js{color:var(--ok)}.json .jn{color:var(--warn)}.json .jb{color:var(--red)}
.why{font-size:var(--step--1);color:var(--muted);min-height:1.6em}
.why b{color:var(--ink);font-weight:500}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.tok{font-family:var(--f-mono);font-size:12px;line-height:1.5;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tok .h{color:var(--red)}.tok .p{color:var(--warn)}.tok .s{color:var(--ok)}
.jwt textarea{width:100%;min-height:118px;resize:vertical}
.sig{font-family:var(--f-mono);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sig .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sig.ok .dot{background:var(--ok)}.sig.bad .dot{background:var(--red)}.sig.exp .dot{background:var(--warn)}
.jrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.clock{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto}
.empty{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.net{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.net td{padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.net td.pth{white-space:normal;overflow-wrap:anywhere;width:100%}
.net tr{cursor:pointer}
.net tr:hover td{background:var(--bg)}
.net .st2{color:var(--ok)}.net .st4{color:var(--red)}
.netwrap{max-height:230px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;padding:10px 16px;border-radius:999px;z-index:30;pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--red);font-weight:500}
@media (max-width:960px){.lab{grid-template-columns:minmax(0,1fr)}.missions{position:static}.lower{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.req{grid-template-columns:minmax(0,1fr) auto}.req select{grid-column:1 / -1}}

/* boot screen */
.boot{position:fixed;inset:0;z-index:50;background:#0B0C0E;color:#ECEDEF;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transition:transform .9s cubic-bezier(.76,0,.24,1);cursor:pointer;overflow:hidden}
.boot.done{transform:translateY(-100%)}
.boot-top{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:12px;opacity:.7}
.boot-log{margin:0;font-family:var(--f-mono);font-size:11.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;opacity:.8;max-width:820px}
.boot-log .ok{color:#7FD6A4}.boot-log .bx{color:#FF8A78}
.boot-flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(2.4rem,11vw,9rem);letter-spacing:-.04em;color:var(--red);opacity:.92}
.boot-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.boot-n{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:clamp(4rem,18vw,13rem);line-height:.8;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.boot-n i{font-style:normal;color:var(--red);font-size:.35em;vertical-align:top}
.boot-skip{font-family:var(--f-mono);font-size:11px;opacity:.6;text-align:right}
.boot-bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--red)}
.booted .mega{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.booted .mega .sub,.booted .hero-grid{animation:rise 1s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
html.booting{overflow:hidden}

/* experience */
.xp{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.xp li{display:grid;grid-template-columns:180px minmax(0,1fr) 160px;gap:12px 32px;padding:24px 0;border-bottom:1px solid var(--line)}
.xp .when{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted);font-variant-numeric:tabular-nums}
.xp h3{font-family:var(--f-display);font-stretch:112%;font-weight:750;text-transform:uppercase;font-size:var(--step-1)}
.xp .org{color:var(--muted);font-size:var(--step--1);margin:2px 0 8px}
.xp ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:var(--step--1)}
.xp .where{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted);text-align:right}

/* leetcode */
.lc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:end}
.lc .big{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:clamp(3.5rem,2rem + 7vw,7.5rem);line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.lc .big sup{font-size:.4em;color:var(--red);vertical-align:.9em}
.lc .cap{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted);margin-top:8px}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px)}
.say{font-family:var(--f-display);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,1.4rem + 5vw,5.6rem);line-height:.86;letter-spacing:-.035em}
.say .s{display:block;font-family:var(--f-script);text-transform:none;color:var(--red);font-weight:700;font-stretch:100%;letter-spacing:0;font-size:.42em;transform:rotate(-4deg);transform-origin:left;margin-top:.15em}
.email{font-family:var(--f-mono);font-size:var(--step-1);user-select:all;word-break:break-all}
.form{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px)}
.form label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.form input,.form select,.form textarea{font-family:var(--f-body);font-size:var(--step-0);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-transform:none;letter-spacing:0;width:100%}
.form textarea{min-height:110px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-note{font-size:var(--step--1);color:var(--muted)}
.form .err{font-family:var(--f-body);font-size:12px;letter-spacing:0;text-transform:none;color:var(--red);min-height:1em}
.form .bad{border-color:var(--red)!important}
.form .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.form-note.ok{color:var(--ok)}.form-note.fail{color:var(--red)}
.send-btn:disabled{opacity:.6;cursor:progress}

/* footer */
.foot{border-top:2px solid var(--ink);padding-block:28px 40px;display:flex;flex-direction:column;gap:24px}
.foot-mark{font-family:var(--f-display);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(3rem,15vw,12rem);line-height:.8;letter-spacing:-.04em}
.foot-mark span{color:var(--red)}
.foot-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted)}
.foot-row nav{display:flex;gap:18px;flex-wrap:wrap}
.foot-row a{text-decoration:none;color:var(--ink)}
.foot-row a:hover{color:var(--red)}

@media (max-width:960px){
  .nav{display:none}
  .hero-grid,.about,.contact,.lc{grid-template-columns:minmax(0,1fr)}
  .skillset{grid-template-columns:repeat(2,minmax(0,1fr))}
  .skill:nth-child(3){padding-left:0;border-left:0}
  .skill:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .console{grid-template-columns:minmax(0,1fr)}
  .c-side{border-right:0;border-bottom:1px solid var(--line)}
  .xp li{grid-template-columns:minmax(0,1fr)}
  .xp .where{text-align:left}
}
@media (max-width:620px){
  .card,.card.small{grid-template-columns:minmax(0,1fr)}
  .meta{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px;flex-direction:row;flex-wrap:wrap;gap:14px 28px}
  .skillset{grid-template-columns:minmax(0,1fr)}
  .skill,.skill + .skill{padding-left:0;border-left:0;border-bottom:1px solid var(--line)}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row2{grid-template-columns:minmax(0,1fr)}
  .script{top:-.35em}
}

        const sag = Math.sqrt(Math.max(0, L0 * L0 - d * d)) * 0.5;
        const mx = (ax + X) / 2, my = Y / 2, nx = d ? -P.y / d : 1, ny = d ? P.x / d : 0;
        const s = P.x >= 0 ? 1 : -1;
        dpath = `M${ax} 0 Q${mx + nx * sag * s} ${my + Math.abs(ny * sag) + sag * 0.6} ${X} ${Y}`;
      } else dpath = `M${ax} 0 L${X} ${Y}`;
      path.setAttribute("d", dpath); edge.setAttribute("d", dpath);
      const target = -Math.atan2(P.x, Math.max(1, P.y)) - Math.max(-.35, Math.min(.35, V.x * 0.00018));
      rot += (target - rot) * (drag ? 0.35 : 0.22);
      badge.style.transform = `translate(${(P.x).toFixed(2)}px,${P.y.toFixed(2)}px) rotate(${rot.toFixed(4)}rad)`;
    };
    const step = dt => {
      if (drag) return;
      const d = Math.hypot(P.x, P.y) || 1, stretch = d - L0;
      let ax2 = 0, ay2 = G;
      if (stretch > 0) { ax2 -= K * stretch * (P.x / d) * 9; ay2 -= K * stretch * (P.y / d) * 9; }
      V.x = (V.x + ax2 * dt) * DAMP; V.y = (V.y + ay2 * dt) * DAMP;
      P.x += V.x * dt; P.y += V.y * dt;
      // keep the string from stretching much: project back
      const d2 = Math.hypot(P.x, P.y);
      if (d2 > L0 + 6) { const ux = P.x / d2, uy = P.y / d2, k = (L0 + 6) / d2; P.x *= k; P.y *= k; const vr = V.x * ux + V.y * uy; if (vr > 0) { V.x -= ux * vr * 0.9; V.y -= uy * vr * 0.9; } }
    };
    const loop = t => {
      const dt = Math.min(0.032, last ? (t - last) / 1000 : 0.016); last = t;
      const sub = 4; for (let i = 0; i < sub; i++) step(dt / sub);
      draw();
      const resting = !drag && Math.hypot(V.x, V.y) < 4 && Math.abs(P.x) < 0.6 && Math.abs(Math.hypot(P.x, P.y) - L0) < 1.5;
      if (resting) { P = { x: 0, y: L0 }; V = { x: 0, y: 0 }; rot = 0; draw(); raf = 0; last = 0; return; }
      raf = requestAnimationFrame(loop);
    };
    const wake = () => { if (!raf) { last = 0; raf = requestAnimationFrame(loop); } };
    const local = e => { const r = rig.getBoundingClientRect(); return { x: e.clientX - r.left - ax, y: e.clientY - r.top }; };

    badge.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      const p = local(e);
      drag = { off: { x: p.x - P.x, y: p.y - P.y }, start: p, moved: 0, hist: [{ ...P, t: performance.now() }] };
      badge.setPointerCapture(e.pointerId); badge.classList.add("grab"); wake();
    });

        if (e.pointerType === "mouse" && !REDUCE) { V.x += Math.max(-40, Math.min(40, e.movementX)) * 9; wake(); }
        return;
      }
      const p = local(e);
      drag.moved = Math.max(drag.moved, Math.hypot(p.x - drag.start.x, p.y - drag.start.y));
      let tx = p.x - drag.off.x, ty = p.y - drag.off.y;
      const d = Math.hypot(tx, ty);
      if (d > L0 + MAXR) { tx *= (L0 + MAXR) / d; ty *= (L0 + MAXR) / d; }
      P = { x: tx, y: ty };
      drag.hist.push({ ...P, t: performance.now() }); if (drag.hist.length > 6) drag.hist.shift();
      if (hint.style.opacity !== "0") hint.style.opacity = "0";
      wake();
    });
    const release = () => {
      if (!drag) return;
      const h = drag.hist, a = h[0], b = h[h.length - 1], dt = Math.max(16, b.t - a.t) / 1000;
      V = { x: (b.x - a.x) / dt, y: (b.y - a.y) / dt };
      const clicked = drag.moved < 6;
      drag = null; badge.classList.remove("grab");
      if (clicked) { V = { x: 0, y: 0 }; flip(); return; }
      if (REDUCE) { P = { x: 0, y: L0 }; V = { x: 0, y: 0 }; draw(); return; }
      if (Math.hypot(V.x, V.y) > 2400) { spin.classList.remove("go"); void spin.offsetWidth; spin.classList.add("go"); say("wheee!"); }
      wake();
    };
    badge.addEventListener("pointerup", release);
    badge.addEventListener("pointercancel", release);
    spin.addEventListener("animationend", () => spin.classList.remove("go"));
    const say = txt => { hint.innerHTML = txt; hint.style.opacity = "1"; clearTimeout(say.t); say.t = setTimeout(() => hint.style.opacity = "0", 1400); };

      if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !REDUCE) { e.preventDefault(); V.x += e.key === "ArrowLeft" ? -700 : 700; wake(); }
    });

    measure(); P = { x: 0, y: L0 }; draw();
    let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { measure(); P = { x: 0, y: L0 }; V = { x: 0, y: 0 }; draw(); }, 120); });

const Staffy = (() => {
  const SECRET = "staffy-hs256-dev";
  const sign = s => { let h = 5381; for (const c of s + SECRET) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; let g = 7; for (const c of SECRET + s) g = ((g << 5) - g + c.charCodeAt(0)) >>> 0; return (h.toString(36) + g.toString(36)).padEnd(14, "x"); };
  const b64 = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, "").replace(/\+/g, "-").replace(/\//g, "_");
  const USERS = { admin: "ADMIN", meera: "MANAGER", arjun: "EMPLOYEE" };
  const EMP = { 7: "kabir", 9: "arjun", 12: "riya", 4: "meera" };
  const seed = () => [
    { id: 102, title: "Fix pagination on /employees", assignee: "arjun", status: "OVERDUE" },
    { id: 117, title: "Leave-approval flow", assignee: "riya", status: "OVERDUE" },
    { id: 121, title: "Index tasks.status for dashboard", assignee: "arjun", status: "OVERDUE" },
    { id: 124, title: "Write onboarding docs", assignee: "kabir", status: "IN_PROGRESS" },
    { id: 126, title: "Audit role checks on /reports", assignee: "riya", status: "DONE" },
  ];
  let tasks = seed(), nextId = 131, offset = 0;
  const now = () => Math.floor(Date.now() / 1000) + offset;
  const issue = user => { const payload = { sub: user, role: USERS[user], iat: now(), exp: now() + 3600 }; return { header: { alg: "HS256", typ: "JWT" }, payload, sig: sign(JSON.stringify(payload)) }; };
  const encode = t => `${b64(t.header)}.${b64(t.payload)}.${t.sig}`;
  const verify = t => !t ? "missing" : t.sig !== sign(JSON.stringify(t.payload)) ? "signature" : !(t.payload.exp > now()) ? "expired" : "ok";
  const err = (status, stopAt, error, message, path, why, extra = {}) => ({ status, stopAt, why, body: { timestamp: new Date((now()) * 1000).toISOString().slice(0, 19), status, error, message, path, ...extra } });
  const parse = body => { try { return [JSON.parse(body || "{}"), null]; } catch { return [null, true]; } };

  const routes = [
    { m: "POST", re: /^\/api\/auth\/login$/, open: true, h: (req, p) => {
      const [b, bad] = parse(req.body);
      if (bad) return err(400, 2, "Bad Request", "Malformed JSON request", p, `Jackson couldn’t parse the body, so the <b>global exception handler</b> turned it into a clean 400.`);
      const fe = []; if (!b.username) fe.push({ field: "username", message: "must not be blank" }); if (!b.password) fe.push({ field: "password", message: "must not be blank" });
      if (fe.length) return err(400, 2, "Bad Request", "Validation failed", p, `<b>@Valid</b> on the login DTO rejected it before the service ran.`, { errors: fe });
      if (!USERS[b.username]) return err(401, 3, "Unauthorized", "Bad credentials", p, `The <b>AuthenticationManager</b> found no such user. Same message as a wrong password, so attackers can’t probe usernames.`);
      const t = issue(b.username);
      return { status: 200, stopAt: 5, token: t, why: `Login is <b>permitAll</b>. The service checked the BCrypt hash and signed a JWT with <b>role: ${t.payload.role}</b>, valid for 1 hour.`,
        body: { token: encode(t), tokenType: "Bearer", role: t.payload.role, expiresIn: 3600 } };
    } },
    { m: "GET", re: /^\/api\/tasks$/, h: (req, p, q, t) => {
      const role = t.payload.role, me = t.payload.sub;
      let rows = role === "EMPLOYEE" ? tasks.filter(x => x.assignee === me) : tasks.slice();
      const st = q.get("status"), s = q.get("search");
      if (st) rows = rows.filter(x => x.status === st.toUpperCase());
      let why = role === "EMPLOYEE" ? `Employees only see <b>their own</b> tasks: the service adds <b>assignee = currentUser</b>.` : `${role === "ADMIN" ? "Admins" : "Managers"} see every task, paginated.`;
      let flag;

      ["main", "RepositoryConfig", "Bootstrapping Spring Data JPA repositories in DEFAULT mode"],

      ["main", "HikariDataSource", "HikariPool-1 - Start completed"],
      ["main", "JpaBaseConfig", "Initialized JPA EntityManagerFactory for 'staffy'"],
      ["main", "SecurityConfig", "Will secure any request with [JwtAuthFilter, AuthorizationFilter]"],
      ["main", "TomcatWebServer", "Tomcat started on port 8080 (http) with context path '/'"],
    ];
    const FLASH = ["@Controller", "@Service", "@Repository", "JWT", "200 OK"];
    const el = document.createElement("div");
    el.className = "boot"; el.setAttribute("role", "status"); el.setAttribute("aria-label", "Loading");
    el.innerHTML = `<div class="boot-top"><span>harsh.dev</span><span>:: spring boot ::</span></div>

    document.body.appendChild(el); document.documentElement.classList.add("booting");
    const logEl = el.querySelector("#boot-log"), nEl = el.querySelector("#boot-n"), bar = el.querySelector("#boot-bar"), fl = el.querySelector("#boot-flash");
    const DUR = REDUCE ? 500 : 2300, t0 = performance.now();
    let shown = 0, raf, ended = false;
    const finish = () => {
      if (ended) return; ended = true; cancelAnimationFrame(raf);
      logEl.insertAdjacentHTML("beforeend", `<span class="ok">${ts()}  INFO  Started HarshApplication in ${((performance.now() - t0) / 1000).toFixed(2)} seconds</span>\n`);
      nEl.textContent = "100"; bar.style.width = "100%"; fl.textContent = "";
      setTimeout(() => {
        document.documentElement.classList.remove("booting"); document.documentElement.classList.add("booted");
        el.classList.add("done");
        setTimeout(() => el.remove(), REDUCE ? 0 : 1000);
      }, REDUCE ? 0 : 280);
      removeEventListener("keydown", finish); el.removeEventListener("click", finish);
    };
    const tick = t => {
      const k = Math.min(1, (t - t0) / DUR), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const pct = Math.floor(e * 100);
      nEl.textContent = String(pct).padStart(3, "0"); bar.style.width = pct + "%";
      while (shown < L.length && shown / L.length <= e) {
        const [th, cls, msg] = L[shown++];
        logEl.insertAdjacentHTML("beforeend", `${ts()}  INFO  [${th}] <span class="bx">${cls}</span> : ${esc(msg)}\n`);
      }
      if (!REDUCE) fl.textContent = k < .92 ? FLASH[Math.floor(k * 22) % FLASH.length] : "";
      if (k < 1) raf = requestAnimationFrame(tick); else finish();
    };
    raf = requestAnimationFrame(tick);
    addEventListener("keydown", finish); el.addEventListener("click", finish);
  }
};

  id: "experience", nav: "Experience", cls: "sec",
  render: () => `
    <div class="sec-head">${head("Experience", "Where I’ve shipped", "")}</div>
    <ul class="xp">${SITE.experience.map(x => `
      <li><span class="when">${esc(x.when)}</span>
        <div><h3>${esc(x.role)}</h3><p class="org">${esc(x.org)}</p><ul>${x.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
        <span class="where">${esc(x.where)}</span></li>`).join("")}
    </ul>
    <div class="lc">
      <div><p class="kicker">Problem solving</p><p class="big">${SITE.leetcode.solved}<sup>+</sup></p><p class="cap">DSA problems solved on LeetCode</p></div>
      <div><p class="big">${SITE.leetcode.rating}</p><p class="cap">contest rating · <a href="${esc(SITE.links[2].url)}" target="_blank" rel="noopener">see profile ↗</a></p></div>
    </div>
    <p class="hint">${esc(SITE.education)}</p>`
};

const Contact = {
  id: "contact", nav: "Contact", cls: "sec",
  render: () => `
    <div class="contact">
      <div style="display:flex;flex-direction:column;gap:22px">
        <p class="kicker">Contact</p>
        <h2 class="say">Let’s build the backend<span class="s">that doesn’t break at 2am.</span></h2>
        <p class="lede">The fastest way to reach me is this form. It lands straight in my Slack, and I usually reply within a day.</p>
        <div class="cta">${cv("pill ghost")}${SITE.links.map(l => `<a class="pill ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
      </div>
      <form class="form" id="form" novalidate>
        <div class="row2">
          <label for="f-name">Name<input id="f-name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="Your name"><span class="err" id="e-name"></span></label>
          <label for="f-email">Email<input id="f-email" name="email" type="email" autocomplete="email" maxlength="120" placeholder="you@company.com"><span class="err" id="e-email"></span></label>
        </div>
        <label for="f-reason">Reason<select id="f-reason" name="reason"><option>Role / opportunity</option><option>Freelance project</option><option>Just saying hi</option></select></label>
        <label for="f-msg">Message<textarea id="f-msg" name="message" maxlength="2000" placeholder="What are you building?"></textarea><span class="err" id="e-msg"></span></label>
        <div class="cta"><button class="pill send-btn" id="f-send" type="submit">Send message →</button></div>
        <p class="form-note" id="f-note" aria-live="polite">Name, email and message are all required.</p>
      </form>
    </div>`,
  mount(el) {
    const $ = s => el.querySelector(s);

    const form = $("#form"), btn = $("#f-send"), note = $("#f-note");
    const fields = { name: $("#f-name"), email: $("#f-email"), msg: $("#f-msg") };
    const setErr = (k, text) => { $("#e-" + k).textContent = text; fields[k].classList.toggle("bad", !!text); };
    const validate = () => {
      const v = { name: fields.name.value.trim(), email: fields.email.value.trim(), msg: fields.msg.value.trim() };
      const errs = {
        name: v.name ? "" : "Add your name.",
        email: !v.email ? "Add your email so I can reply." : /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email) ? "" : "That email doesn’t look right.",
        msg: v.msg.length >= 10 ? "" : "Write at least a sentence."
      };
      Object.entries(errs).forEach(([k, t]) => setErr(k, t));
      return Object.values(errs).every(t => !t) ? v : null;
    };
    Object.entries(fields).forEach(([k, f]) => f.addEventListener("input", () => { if (f.classList.contains("bad")) setErr(k, ""); }));
    const COOLDOWN = 30000, loadedAt = performance.now();
    let lastSent = 0;
    try { lastSent = +localStorage.getItem("contact-last") || 0; } catch {}

    form.addEventListener("submit", async e => {
      e.preventDefault();
      note.className = "form-note";
      const v = validate();
      if (!v) { note.textContent = "Fill in the highlighted fields first."; note.className = "form-note fail"; (fields.name.classList.contains("bad") ? fields.name : fields.email.classList.contains("bad") ? fields.email : fields.msg).focus(); return; }
      if (performance.now() - loadedAt < 2500) { note.textContent = "One second, then press send again."; return; }   // bots submit instantly
      const wait = COOLDOWN - (Date.now() - lastSent);
      if (wait > 0) { note.textContent = `You just sent one. Try again in ${Math.ceil(wait / 1000)} seconds.`; note.className = "form-note fail"; return; }

      const reason = $("#f-reason").value;
      btn.disabled = true; btn.textContent = "Sending…"; note.textContent = "";
      try {
        const res = await fetch(SITE.contactEndpoint, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: v.name, email: v.email, reason, message: v.msg }) });
        if (!res.ok) throw new Error("status " + res.status);
        lastSent = Date.now(); try { localStorage.setItem("contact-last", String(lastSent)); } catch {}
        form.reset();
        note.textContent = "Message sent. I’ll get back to you soon."; note.className = "form-note ok";
      } catch {
        note.textContent = "Couldn’t send right now. Please try again in a minute."; note.className = "form-note fail";
      } finally { btn.disabled = false; btn.textContent = "Send message →"; }
    });
  }
};

const Footer = {
  render: () => `
    <p class="foot-mark" aria-hidden="true">harsh<span>.</span></p>
    <div class="foot-row"><span>© 2026 ${esc(SITE.name)} · Java backend developer · based in India, open worldwide</span>
      <nav aria-label="Profiles">${SITE.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}<a href="#hero">Back to top ↑</a></nav></div>`
};

const SECTIONS = [Hero, Marquee, About, Skills, Work, Console, Experience, Contact];

/* ============================================================
   RENDER
   ============================================================ */
Boot.run();
const app = document.getElementById("app"), nav = document.getElementById("nav");
SECTIONS.forEach(S => {
  const el = document.createElement(S.cls === "marquee" ? "div" : "section");
  el.id = S.id; if (S.cls) el.className = S.cls; el.innerHTML = S.render(); app.appendChild(el);
  if (S.nav) nav.insertAdjacentHTML("beforeend", `<a href="#${S.id}" data-id="${S.id}">${esc(S.nav)}</a>`);
});
document.getElementById("foot").innerHTML = Footer.render();
SECTIONS.forEach(S => S.mount && S.mount(document.getElementById(S.id)));

const links = [...nav.querySelectorAll("a")];
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && links.forEach(a => a.classList.toggle("on", a.dataset.id === e.target.id))), { rootMargin: "-35% 0px -55% 0px" });
  SECTIONS.filter(S => S.nav).forEach(S => io.observe(document.getElementById(S.id)));
}

/* ============================================================
   RÉSUMÉ DOWNLOAD
   Self-hosted: the plain <a download> link works on its own.
   Inside a claude.ai artifact: hand the file to the viewer's save prompt.
   ============================================================ */
let DL = null, cvBlob = null;
const cvNote = document.getElementById("cv-note");
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d => {
    DL = d;
    if (DL) fetch(SITE.resume.href).then(r => r.ok ? r.blob() : null).then(b => cvBlob = b).catch(() => {});
  }).catch(() => {});
}
document.querySelectorAll("[data-cv]").forEach(a => a.addEventListener("click", async e => {
  if (!DL) return;
  e.preventDefault();
  try {
    const data = cvBlob || await fetch(SITE.resume.href).then(r => r.blob());
    await DL.save({ filename: SITE.resume.filename, data });
    cvNote.textContent = "Résumé saved.";
  } catch (err) {
    cvNote.textContent = err && err.code === "declined" ? "" : "The download didn’t start. Try again in a moment.";
  }
}));
</script>
</body>
</html>
